<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Laxminarayan Developers</title>

    <!-- Tamari Theme na Icons ane CSS -->
    <link rel="icon" type="image/png" href="/properties/laxminarayandevelopers-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Global Reset - બધી સ્ક્રીન પર પરફેક્ટ સ્પેસિંગ માટે */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fdfdfd;
            font-family: 'Montserrat', sans-serif;
        }

        /* 404 Section Custom Styling */
        .error-page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* height ની જગ્યાએ min-height જેથી નાની સ્ક્રીનમાં કન્ટેન્ટ કપાય નહીં */
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-size: 150px;
            font-weight: 800;
            color: #111;
            line-height: 1;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 30px;
            font-weight: 700;
            color: #FFB347; /* Tamaro Amber Color */
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .error-desc {
            font-size: 16px;
            color: #666;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .back-home-btn {
            background: #FFB347;
            color: #000;
            padding: 14px 35px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.3);
        }

        .back-home-btn:hover {
            background: #e69500;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 179, 71, 0.4);
        }

        /* -------------------------------------
           Responsive Design (Media Queries)
        ---------------------------------------- */

        /* Tablet View (iPad વગેરે માટે) */
        @media (max-width: 768px) {
            .error-code {
                font-size: 110px;
            }
            .error-title {
                font-size: 24px;
            }
            .error-desc {
                font-size: 15px;
                padding: 0 15px; /* સાઈડમાંથી જગ્યા રાખવા */
            }
        }

        /* Mobile View (ફોન માટે) */
        @media (max-width: 480px) {
            .error-code {
                font-size: 80px; /* મોબાઇલમાં 404 નાનું દેખાશે જેથી સ્ક્રીન બહાર ન જાય */
            }
            .error-title {
                font-size: 20px;
                letter-spacing: 1px;
            }
            .error-desc {
                font-size: 14px;
                margin-bottom: 25px;
            }
            .back-home-btn {
                padding: 12px 30px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- 404 Error Content -->
    <div class="error-page-wrapper">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">This Page Does Not Exist</h2>
        <p class="error-desc">We apologize, but the page you are looking for cannot be found. It may have been moved,
            deleted, or the URL may be incorrect. Please check the web address or return to our homepage to continue
            browsing.</p>
        <a href="/" class="back-home-btn">GO TO HOME PAGE</a>
    </div>

</body>

</html>
